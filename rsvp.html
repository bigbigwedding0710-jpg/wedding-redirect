<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save the Date · 吳梁聯婚 Rainkie &amp; Thomas</title>

<!-- WhatsApp / 社交平台預覽（要改請改呢度） -->
<meta name="description" content="我哋結婚喇！請預留日子 · Save the date">
<meta property="og:type" content="website">
<meta property="og:title" content="Save the Date 💕 Rainkie &amp; Thomas · 吳梁聯婚">
<meta property="og:description" content="我哋結婚喇！請預留日子，撳入嚟確認出席 🎉">
<meta property="og:url" content="https://bigbigwedding0710-jpg.github.io/wedding-redirect/rsvp.html">
<meta property="og:image" content="https://bigbigwedding0710-jpg.github.io/wedding-redirect/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#fdfaf5">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fdfaf5; font-family: 'DM Sans', -apple-system, 'PingFang HK', sans-serif; color: #4a4a4a; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font-family: inherit; -webkit-appearance: none; }
button { cursor: pointer; }

.bg1, .bg2 { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.bg1 { top: -120px; right: -120px; width: 320px; height: 320px; background: rgba(232,165,160,.14); }
.bg2 { bottom: -100px; left: -100px; width: 280px; height: 280px; background: rgba(138,171,138,.12); }

.wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 28px 16px 60px; }

/* Save the date */
.std { text-align: center; padding: 10px 6px 26px; }
.kicker { font-size: 12px; letter-spacing: 6px; color: #4f6b4f; }
.hero { margin: 18px auto 6px; }
.hero img { width: 100%; max-height: 360px; object-fit: contain; border-radius: 18px; display: block; }
.hero-ph { font-size: 34px; letter-spacing: 10px; opacity: .85; padding: 8px 0; }
.sd { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 54px; color: #b85a53; line-height: 1.05; margin-top: 6px; }
.names { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 500; color: #4a4a4a; margin-top: 10px; letter-spacing: 1px; }
.cn { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: #6b8f6b; letter-spacing: 6px; margin-top: 2px; }
.divider { display: flex; align-items: center; gap: 10px; margin: 16px auto; max-width: 220px; }
.divider span { flex: 1; height: 1px; background: rgba(232,165,160,.5); }
.divider i { color: #e8a5a0; font-style: normal; }
.date { font-family: 'Cormorant Garamond', serif; font-size: 26px; color: #d4756e; letter-spacing: 1px; }
.place { font-size: 15px; color: #6b6560; margin-top: 6px; }
.count { display: inline-block; margin-top: 12px; padding: 6px 16px; border-radius: 20px; background: rgba(212,117,110,.1); color: #b85a53; font-size: 13px; font-weight: 500; }
.note { font-size: 12px; color: #9a9490; margin-top: 14px; font-style: italic; }

/* Card */
.card { background: rgba(255,255,255,.92); border: 1px solid #f0e0c0; border-radius: 24px; box-shadow: 0 20px 50px rgba(184,90,83,.12); overflow: hidden; }
.card-h { background: linear-gradient(135deg, rgba(232,165,160,.18), rgba(138,171,138,.10)); padding: 22px 20px 16px; text-align: center; }
.card-h h2 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; color: #b85a53; }
.card-h p { font-size: 13px; color: #4f6b4f; margin-top: 4px; }
.card-b { padding: 22px 20px; }

.field { margin-bottom: 20px; }
.field > label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #4f6b4f; margin-bottom: 8px; }
.req { color: #e8a5a0; }
.opt { color: #c9c2b8; text-transform: none; letter-spacing: 0; font-size: 11px; }
.field input[type=text], .field textarea { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid #f0e0c0; background: #fdfaf5; font-size: 16px; color: #4a4a4a; outline: none; resize: none; }
.field input:focus, .field textarea:focus { border-color: #e8a5a0; box-shadow: 0 0 0 3px rgba(232,165,160,.2); }
::placeholder { color: #c9c2b8; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ch { padding: 13px 8px; border-radius: 14px; border: 2px solid #f0e0c0; background: #fdfaf5; font-size: 14px; color: #9a9490; text-align: center; }
.ch.on { border-color: #d4756e; background: rgba(212,117,110,.1); color: #b85a53; font-weight: 500; }
.nums { display: grid; gap: 8px; grid-template-columns: repeat(5, 1fr); }
.nums .ch { padding: 12px 4px; font-size: 16px; font-weight: 500; }
.gnames { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
.gnames.show { display: flex; }
.grow { display: flex; align-items: center; gap: 10px; }
.gnum { color: #e8a5a0; font-weight: 500; min-width: 22px; text-align: center; font-size: 13px; }
.grow input { flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid #f0e0c0; background: #fdfaf5; font-size: 16px; outline: none; }
.grow input:focus { border-color: #e8a5a0; }

.err { background: #fdf0ef; border: 1px solid #f5cfcb; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #c05c54; text-align: center; display: none; }

/* Fun attending button */
.coming { width: 100%; padding: 20px 12px; border: none; border-radius: 22px; color: #fff; font-size: 20px; font-weight: 500; line-height: 1.35; background: linear-gradient(135deg, #e8a5a0, #d4756e 55%, #b85a53); box-shadow: 0 12px 28px rgba(212,117,110,.45); animation: bounce 2.4s ease-in-out infinite; }
.coming small { display: block; font-size: 13px; opacity: .9; margin-top: 2px; font-weight: 400; letter-spacing: 1px; }
.coming:active { transform: scale(.97); animation: none; }
.coming:disabled { background: #f0e0c0; color: #c9c2b8; box-shadow: none; animation: none; }
@keyframes bounce { 0%, 100% { transform: translateY(0) rotate(0); } 10% { transform: translateY(-6px) rotate(-1.5deg); } 20% { transform: translateY(0) rotate(1.5deg); } 30% { transform: translateY(-3px) rotate(0); } 40% { transform: translateY(0); } }
.hint { text-align: center; font-size: 12px; color: #9a9490; margin-top: 12px; line-height: 1.6; }

/* Success */
.ok { text-align: center; padding: 34px 20px 28px; }
.ok .big { font-size: 56px; }
.ok h3 { font-family: 'Cormorant Garamond', serif; font-size: 30px; color: #6b8f6b; margin: 8px 0; }
.ok .sum { text-align: left; background: #fdfaf5; border-radius: 14px; padding: 14px 16px; margin: 18px 0; font-size: 14px; color: #6b6560; line-height: 1.9; white-space: pre-line; }
.again { background: none; border: 1px solid #f0e0c0; border-radius: 12px; padding: 10px 20px; font-size: 13px; color: #b85a53; }

.foot { text-align: center; margin-top: 26px; font-family: 'Cormorant Garamond', serif; font-style: italic; color: #c9c2b8; font-size: 15px; }

/* Confetti */
.cf { position: fixed; top: -30px; z-index: 100; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }

@media (prefers-reduced-motion: reduce) { .coming { animation: none; } .cf { display: none; } }
@media (max-width: 380px) { .sd { font-size: 46px; } }
</style>
</head>
<body>
<div class="bg1"></div><div class="bg2"></div>

<div class="wrap">

  <!-- ═══ SAVE THE DATE ═══ -->
  <section class="std">
    <p class="kicker">WE'RE GETTING MARRIED</p>
    <div class="hero" id="hero"></div>
    <p class="sd">Save the Date</p>
    <p class="names">Rainkie &amp; Thomas</p>
    <p class="cn">吳梁聯婚</p>
    <div class="divider"><span></span><i>✦</i><span></span></div>
    <p class="date" id="evDate"></p>
    <p class="place" id="evPlace"></p>
    <p class="count" id="evCount" style="display:none"></p>
    <p class="note" id="evNote"></p>
  </section>

  <!-- ═══ RSVP ═══ -->
  <section class="card">
    <div class="card-h">
      <h2>一齊慶祝 Join us 🥂</h2>
      <p>填好資料，撳最底個掣就搞掂！</p>
    </div>

    <div class="card-b" id="formView">

      <div class="field">
        <label>Your Name · 你的姓名 <span class="req">*</span></label>
        <input type="text" id="name" placeholder="e.g. Chan Tai Man · 陳大文" maxlength="50" autocomplete="name">
      </div>

      <div class="field">
        <label>男家 / 女家 Side <span class="req">*</span></label>
        <div class="two" id="sideBtns">
          <button class="ch" data-v="groom">🤵 男家 Groom</button>
          <button class="ch" data-v="bride">👰 女家 Bride</button>
        </div>
      </div>

      <div class="field">
        <label id="cntLabel">Additional guests · 同行人數</label>
        <div class="nums" id="numBtns"></div>
        <div class="gnames" id="gNames"></div>
      </div>

      <div class="field">
        <label>Message to the couple · 給新人的話 <span class="opt">(optional · 可選)</span></label>
        <textarea id="message" rows="3" maxlength="300" placeholder="e.g. Congratulations! · 恭喜晒！"></textarea>
      </div>

      <div class="err" id="err"></div>

      <button class="coming" id="goBtn">
        🎉 我哋一定到！
        <small>WE'LL BE THERE!</small>
      </button>
      <p class="hint">
        撳一下就會通知新人你出席 ✓<br>
        未能出席？請直接WhatsApp我哋 · Can't make it? Just message us 💌
      </p>
    </div>

    <div class="card-b" id="okView" style="display:none">
      <div class="ok">
        <div class="big">🥳</div>
        <h3>太好喇！多謝你！</h3>
        <p style="font-size:14px;color:#9a9490">We can't wait to celebrate with you 💕</p>
        <p class="sum" id="sum"></p>
        <button class="again" id="againBtn">幫另一位朋友登記 · Add another RSVP</button>
      </div>
    </div>
  </section>

  <p class="foot">with love ✦</p>
</div>

<script>
// ═══════════════ 你可以改嘅設定 ═══════════════
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbztgFC9Jd5mkrLs92X2fsD5RIi6QyuQhtv0dhaDg9HduAaN9AsMaQT61bB2k5mUI5Pz/exec';

var EVENT = {
  dateText:  '日期待定 · Date to be announced',   // 定咗日子，改做例如 '2027年10月9日（六）'
  placeText: '地點待定 · Venue TBA',               // 例如 '香港 · 某某酒店'
  isoDate:   '',                                   // 例如 '2027-10-09'，填咗會顯示倒數日數
  note:      '正式邀請函稍後送上 · Formal invitation to follow'
};

var HERO_IMG = 'save-the-date.jpg';        // 插圖：上傳圖片去GitHub後，寫檔名，例如 'save-the-date.jpg'
var MAX_GUESTS = 4;       // 同行人數上限
// ═══════════════════════════════════════════════

var side = '', count = 0, sending = false;
function $(id) { return document.getElementById(id); }

// 防止Google Sheet把「=」開頭嘅文字當公式
function safe(v) {
  v = String(v || '');
  return /^[=+\-@]/.test(v) ? "'" + v : v;
}

function renderEvent() {
  $('evDate').textContent = EVENT.dateText;
  $('evPlace').textContent = EVENT.placeText;
  $('evNote').textContent = EVENT.note;
  var c = $('evCount');
  c.style.display = 'none';
  if (EVENT.isoDate) {
    var days = Math.ceil((new Date(EVENT.isoDate + 'T00:00:00') - new Date()) / 86400000);
    if (days > 0) {
      c.textContent = '還有 ' + days + ' 日 · ' + days + ' days to go';
      c.style.display = 'inline-block';
    }
  }
}

function renderHero() {
  var h = $('hero');
  if (HERO_IMG) {
    var img = document.createElement('img');
    img.src = HERO_IMG;
    img.alt = 'Save the date';
    h.innerHTML = '';
    h.appendChild(img);
  } else {
    h.innerHTML = '<div class="hero-ph">🌸 💍 🌸</div>';
  }
}

function buildNums() {
  var box = $('numBtns');
  box.style.gridTemplateColumns = 'repeat(' + (MAX_GUESTS + 1) + ', 1fr)';
  box.innerHTML = '';
  for (var i = 0; i <= MAX_GUESTS; i++) {
    var b = document.createElement('button');
    b.className = 'ch' + (i === count ? ' on' : '');
    b.setAttribute('data-n', i);
    b.textContent = i;
    box.appendChild(b);
  }
  $('cntLabel').innerHTML = 'Additional guests · 同行人數 <span class="opt">(最多 max ' + MAX_GUESTS + ' · 淨係你就選 0)</span>';
}

function buildNames() {
  var box = $('gNames');
  box.innerHTML = '';
  box.classList.toggle('show', count > 0);
  for (var i = 1; i <= count; i++) {
    var row = document.createElement('div');
    row.className = 'grow';
    row.innerHTML = '<span class="gnum">✦' + i + '</span>';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.id = 'g' + i;
    inp.maxLength = 50;
    inp.placeholder = 'Guest ' + i + ' name · 第' + i + '位姓名';
    row.appendChild(inp);
    box.appendChild(row);
  }
}

$('sideBtns').addEventListener('click', function (e) {
  var b = e.target.closest('.ch'); if (!b) return;
  side = b.getAttribute('data-v');
  this.querySelectorAll('.ch').forEach(function (x) { x.classList.toggle('on', x === b); });
});
$('numBtns').addEventListener('click', function (e) {
  var b = e.target.closest('.ch'); if (!b) return;
  count = Number(b.getAttribute('data-n'));
  this.querySelectorAll('.ch').forEach(function (x) { x.classList.toggle('on', x === b); });
  buildNames();
});

function showErr(msg) { var e = $('err'); e.textContent = msg; e.style.display = 'block'; }

function send(url) {
  var req = window.fetch
    ? fetch(url, { mode: 'no-cors' })
    : new Promise(function (res) { var i = new Image(); i.onload = res; i.onerror = res; i.src = url; });
  var timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 25000); });
  return Promise.race([req, timeout]);
}

function confetti() {
  var bits = ['🎉', '💕', '✨', '🌸', '🥂', '💍', '🎊'];
  for (var i = 0; i < 36; i++) {
    var s = document.createElement('span');
    s.className = 'cf';
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 18) + 'px';
    s.style.animationDuration = (2.4 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.6) + 's';
    document.body.appendChild(s);
    (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 5500); })(s);
  }
}

function submit() {
  if (sending) return;
  var name = $('name').value.trim();
  $('err').style.display = 'none';
  if (!name) { showErr('請輸入你的姓名 · Please enter your name'); $('name').focus(); return; }
  if (!side) { showErr('請選擇男家或女家 · Please choose Groom or Bride side'); return; }

  var guests = [];
  for (var i = 1; i <= count; i++) {
    var g = $('g' + i);
    guests.push((g && g.value.trim()) || '(no name)');
  }

  var params = new URLSearchParams({
    name: safe(name),
    attending: 'Yes · 出席',
    side: side === 'groom' ? 'Groom · 男家' : 'Bride · 女家',
    guestCount: String(count),
    guestNames: safe(guests.join(', ')),
    message: safe($('message').value.trim())
  });

  sending = true;
  var btn = $('goBtn');
  btn.disabled = true;
  btn.innerHTML = '提交緊… Sending…';

  send(SCRIPT_URL + '?' + params.toString()).then(function () {
    sending = false;
    showOk(name, guests);
  }).catch(function () {
    sending = false;
    btn.disabled = false;
    btn.innerHTML = '🎉 我哋一定到！<small>WE\'LL BE THERE!</small>';
    showErr('網絡有問題，請再撳一次 · Connection problem, please try again');
  });
}

function showOk(name, guests) {
  $('formView').style.display = 'none';
  $('okView').style.display = 'block';
  var t = '👤 ' + name + '\n' + (side === 'groom' ? '🤵 男家 Groom' : '👰 女家 Bride') + '\n👥 同行 Additional: ' + count;
  guests.forEach(function (g, i) { t += '\n   ' + (i + 1) + '. ' + g; });
  $('sum').textContent = t;
  window.scrollTo(0, 0);
  confetti();
}

function again() {
  $('name').value = '';
  $('message').value = '';
  $('err').style.display = 'none';
  side = '';
  count = 0;
  $('sideBtns').querySelectorAll('.ch').forEach(function (x) { x.classList.remove('on'); });
  buildNums();
  buildNames();
  var btn = $('goBtn');
  btn.disabled = false;
  btn.innerHTML = '🎉 我哋一定到！<small>WE\'LL BE THERE!</small>';
  $('okView').style.display = 'none';
  $('formView').style.display = 'block';
}

$('goBtn').addEventListener('click', submit);
$('againBtn').addEventListener('click', again);

renderEvent();
renderHero();
buildNums();
</script>
</body>
</html>
